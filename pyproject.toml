[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-ma-provider"
dynamic = ["version"]
description = "YouTube and YouTube Music providers for Music Assistant via tutubo and yt-dlp"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "music-assistant-plugin-manager",
    "music-assistant-models>=1.1.206",
    "tutubo>=4.3.1a2",
    "yt-dlp>=2026.8.30.232658.dev0",
]

[project.entry-points."music_assistant.provider"]
tutubo_music   = "youtube_ma_provider.ytmusic"
tutubo_youtube = "youtube_ma_provider.youtube"

[tool.setuptools.dynamic]
version = { attr = "youtube_ma_provider.version.__version__" }

[tool.setuptools.packages.find]
include = ["youtube_ma_provider*"]

[tool.setuptools.package-data]
"youtube_ma_provider.ytmusic" = ["manifest.json"]
"youtube_ma_provider.youtube" = ["manifest.json"]

